<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sketchef">
  <!-- blueprint tile -->
  <rect width="100" height="100" rx="22" fill="#12314f"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#5bd0e6" stroke-opacity="0.5" stroke-width="2"/>

  <!-- a drawn "sketch" trace passing through a solder pad, terminating in nodes -->
  <g stroke="#5bd0e6" stroke-width="4.4" stroke-linecap="round" fill="none">
    <path d="M23 29 L41 41"/>
    <path d="M59 59 L77 71"/>
  </g>
  <g fill="#5bd0e6">
    <circle cx="23" cy="29" r="4.2"/>
    <circle cx="77" cy="71" r="4.2"/>
  </g>

  <!-- central solder pad: annular ring + bright via -->
  <circle cx="50" cy="50" r="13" fill="none" stroke="#5bd0e6" stroke-width="4.6"/>
  <circle cx="50" cy="50" r="4.6" fill="#eef4fc"/>
</svg>
