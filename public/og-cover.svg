<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="82%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#14c3ca" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14c3ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8079"/>
      <stop offset="1" stop-color="#0f544f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d488"/>
      <stop offset="0.5" stop-color="#cfa444"/>
      <stop offset="1" stop-color="#a97f2c"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
  </defs>

  <!-- teal-ink field (the hero plane) -->
  <rect width="1200" height="630" fill="#04363a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint PCB traces + vias, biased to the right behind the board -->
  <g fill="none" stroke="#14c3ca" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1200 120 H1010 L975 155 H820"/>
    <path d="M1200 250 H1050 L1015 285 H900"/>
    <path d="M760 40 V95 L795 130 V240"/>
    <path d="M1120 470 H980 L945 435 V360"/>
    <path d="M700 590 V520 L735 485 H840"/>
  </g>
  <g fill="#14c3ca" fill-opacity="0.5">
    <circle cx="975" cy="155" r="3.4"/>
    <circle cx="1015" cy="285" r="3.4"/>
    <circle cx="795" cy="130" r="3.4"/>
    <circle cx="945" cy="435" r="3.4"/>
    <circle cx="735" cy="485" r="3.4"/>
  </g>

  <!-- masthead: the "A" circuit-trace mark + wordmark -->
  <g transform="translate(74,50) scale(0.46)">
    <rect width="100" height="100" rx="22" fill="#04363a" stroke="#0a5257" stroke-width="2"/>
    <g stroke="#14c3ca" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M16 68 H32 L42 36 H58 L68 68 H84"/>
    </g>
    <circle cx="50" cy="36" r="9" fill="#04363a" stroke="#14c3ca" stroke-width="5"/>
    <circle cx="50" cy="36" r="3.2" fill="#ffffff"/>
    <circle cx="16" cy="68" r="4.6" fill="#ffffff"/>
    <circle cx="84" cy="68" r="4.6" fill="#ffffff"/>
  </g>
  <text x="134" y="87" font-size="34" font-weight="800" fill="#eef6f6" letter-spacing="-1">Sketchef</text>

  <!-- eyebrow -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <line x1="76" y1="163" x2="102" y2="163" stroke="#14c3ca" stroke-width="2"/>
    <text x="114" y="169" font-size="16" font-weight="700" fill="#14c3ca" letter-spacing="4">ARDUINO PROJECT CATALOG</text>
  </g>

  <!-- headline: white lead (your kit), teal accent payoff (what you can build) -->
  <g font-weight="800" letter-spacing="-1.5">
    <text x="72" y="244" font-size="48" fill="#eef6f6">With your Arduino</text>
    <text x="72" y="304" font-size="48" fill="#eef6f6">and parts,</text>
    <text x="72" y="364" font-size="48" fill="#14c3ca">see what you can build.</text>
  </g>

  <!-- subhead -->
  <g fill="#9fbcbd" font-size="22">
    <text x="74" y="432">Browse every Arduino project, then set up your kit</text>
    <text x="74" y="462">and see exactly which ones you can build right now.</text>
  </g>

  <!-- catalog readout -->
  <text x="74" y="556" font-size="18" font-weight="700" fill="#14c3ca" letter-spacing="2.5"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">20 PROJECTS &#183; 14 COMPONENTS &#183; 5 BOARDS</text>

  <!-- the board: a teal UNO on a soft glow, echoing the hero centrepiece -->
  <g transform="translate(760,196)">
    <ellipse cx="170" cy="120" rx="210" ry="150" fill="#14c3ca" fill-opacity="0.12"/>

    <!-- USB + barrel jack nubs -->
    <rect x="6" y="70" width="26" height="34" rx="3" fill="#aeb8c2" stroke="#5f6a76" stroke-width="1.4"/>
    <rect x="10" y="120" width="20" height="22" rx="3" fill="#1a1f26" stroke="#3a424c" stroke-width="1.2"/>

    <!-- PCB plate -->
    <rect x="30" y="34" width="300" height="176" rx="12" fill="url(#plate)" stroke="#083330" stroke-width="2.5"/>
    <rect x="40" y="44" width="280" height="156" rx="7" fill="none" stroke="#ddf1ec" stroke-opacity="0.2" stroke-width="1.4"/>

    <!-- gold header rails -->
    <g>
      <rect x="70" y="44" width="220" height="15" rx="3" fill="#0c0f14" opacity="0.9"/>
      <rect x="70" y="185" width="220" height="15" rx="3" fill="#0c0f14" opacity="0.9"/>
    </g>
    <g fill="url(#gold)">
      <!-- top pads -->
      <rect x="80" y="47" width="7" height="9"/><rect x="98" y="47" width="7" height="9"/><rect x="116" y="47" width="7" height="9"/><rect x="134" y="47" width="7" height="9"/><rect x="152" y="47" width="7" height="9"/><rect x="170" y="47" width="7" height="9"/><rect x="188" y="47" width="7" height="9"/><rect x="206" y="47" width="7" height="9"/><rect x="224" y="47" width="7" height="9"/><rect x="242" y="47" width="7" height="9"/><rect x="260" y="47" width="7" height="9"/><rect x="278" y="47" width="7" height="9"/>
      <!-- bottom pads -->
      <rect x="80" y="188" width="7" height="9"/><rect x="98" y="188" width="7" height="9"/><rect x="116" y="188" width="7" height="9"/><rect x="134" y="188" width="7" height="9"/><rect x="152" y="188" width="7" height="9"/><rect x="170" y="188" width="7" height="9"/><rect x="188" y="188" width="7" height="9"/><rect x="206" y="188" width="7" height="9"/><rect x="224" y="188" width="7" height="9"/><rect x="242" y="188" width="7" height="9"/><rect x="260" y="188" width="7" height="9"/><rect x="278" y="188" width="7" height="9"/>
    </g>

    <!-- silkscreen -->
    <text x="180" y="86" text-anchor="middle" font-size="13" fill="#ddf1ec" fill-opacity="0.85" letter-spacing="3"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">UNO R3</text>

    <!-- QFP MCU with gold leads -->
    <g fill="url(#gold)">
      <rect x="140" y="104" width="6" height="3"/><rect x="140" y="114" width="6" height="3"/><rect x="140" y="124" width="6" height="3"/>
      <rect x="214" y="104" width="6" height="3"/><rect x="214" y="114" width="6" height="3"/><rect x="214" y="124" width="6" height="3"/>
    </g>
    <rect x="146" y="96" width="68" height="44" rx="4" fill="url(#chip)" stroke="#04070b" stroke-width="1.4"/>
    <circle cx="154" cy="104" r="2.4" fill="none" stroke="#8ea0ad" stroke-width="1.2"/>
    <text x="180" y="122" text-anchor="middle" font-size="10" fill="#b9c4cd"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">ATmega328P</text>

    <!-- mounting holes -->
    <g><circle cx="46" cy="50" r="5" fill="url(#gold)"/><circle cx="46" cy="50" r="2.2" fill="#083330"/></g>
    <g><circle cx="314" cy="50" r="5" fill="url(#gold)"/><circle cx="314" cy="50" r="2.2" fill="#083330"/></g>
    <g><circle cx="46" cy="194" r="5" fill="url(#gold)"/><circle cx="46" cy="194" r="2.2" fill="#083330"/></g>
    <g><circle cx="314" cy="194" r="5" fill="url(#gold)"/><circle cx="314" cy="194" r="2.2" fill="#083330"/></g>

    <!-- power LED -->
    <circle cx="300" cy="66" r="5" fill="#14c3ca"/>
    <circle cx="300" cy="66" r="9" fill="none" stroke="#14c3ca" stroke-opacity="0.4" stroke-width="3"/>
  </g>
</svg>
