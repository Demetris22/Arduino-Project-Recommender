<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#6f86a8" fill-opacity="0.16"/>
    </pattern>
    <radialGradient id="plateGlow" cx="82%" cy="4%" r="70%">
      <stop offset="0%" stop-color="#2563b0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- drafting table -->
  <rect width="1200" height="630" fill="#e7ecf3"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- the drawing sheet, lifted off the table with a double rule -->
  <rect x="40" y="34" width="1120" height="562" rx="18" fill="#f5f8fc" stroke="#b8c4d6" stroke-width="2"/>
  <rect x="49" y="43" width="1102" height="544" rx="11" fill="none" stroke="#d3dce8" stroke-width="1.5"/>

  <!-- masthead: mark + wordmark, drawing reference on the right -->
  <g transform="translate(80,62) scale(0.54)">
    <rect width="100" height="100" rx="22" fill="#eaeef4"/>
    <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#9aabc1" stroke-width="2"/>
    <g fill="#2563b0">
      <circle cx="34" cy="44" r="15"/>
      <circle cx="50" cy="36" r="18"/>
      <circle cx="66" cy="44" r="15"/>
      <rect x="30" y="42" width="40" height="22"/>
    </g>
    <rect x="28" y="60" width="44" height="14" rx="3" fill="#1e4e8c"/>
    <rect x="33" y="66" width="34" height="2.4" rx="1.2" fill="#eaeef4"/>
    <g fill="#c24234">
      <circle cx="38" cy="67.2" r="2.7"/>
      <circle cx="50" cy="67.2" r="2.7"/>
      <circle cx="62" cy="67.2" r="2.7"/>
    </g>
    <g stroke="#c24234" stroke-width="2.6" stroke-linecap="round">
      <line x1="40" y1="74" x2="40" y2="82"/>
      <line x1="50" y1="74" x2="50" y2="85"/>
      <line x1="60" y1="74" x2="60" y2="82"/>
    </g>
    <g fill="#c24234">
      <circle cx="40" cy="84" r="2.3"/>
      <circle cx="50" cy="87" r="2.3"/>
      <circle cx="60" cy="84" r="2.3"/>
    </g>
  </g>
  <text x="150" y="90" font-size="33" font-weight="700" fill="#1f2d40" letter-spacing="-0.5">Sketchef</text>
  <text x="152" y="113" font-size="14" font-weight="600" fill="#7d8ba0" letter-spacing="3"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">ARDUINO PROJECT FINDER</text>
  <text x="1120" y="96" text-anchor="end" font-size="15" font-weight="600" fill="#7d8ba0" letter-spacing="2"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">DWG. 00 · COVER SHEET</text>
  <line x1="80" y1="140" x2="1120" y2="140" stroke="#b8c4d6" stroke-width="1.5"/>
  <line x1="80" y1="143.5" x2="1120" y2="143.5" stroke="#d3dce8" stroke-width="1"/>

  <!-- headline -->
  <text x="80" y="252" font-size="70" font-weight="800" fill="#1f2d40" letter-spacing="-2">What can you build</text>
  <text x="80" y="332" font-size="70" font-weight="800" fill="#2563b0" letter-spacing="-2">right now?</text>

  <!-- subhead -->
  <text x="82" y="392" font-size="24" fill="#47566b">Pick your Arduino board and the parts you own —</text>
  <text x="82" y="426" font-size="24" fill="#47566b">get the projects you can actually build: wiring, steps, code.</text>

  <!-- primary action + catalog readout -->
  <g transform="translate(82,454)">
    <rect width="214" height="52" rx="10" fill="#2563b0" stroke="#1e4e8c" stroke-width="1.5"/>
    <text x="26" y="33" font-size="21" font-weight="700" fill="#eef4fb">Start building &#8594;</text>
  </g>
  <text x="82" y="548" font-size="17" font-weight="600" fill="#7d8ba0" letter-spacing="1.5"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">5 BOARDS · 14 COMPONENTS · 20 PROJECTS MAPPED</text>

  <!-- key drawing: FIG. 01 blink an LED, framed as a plate with corner ticks -->
  <g>
    <rect x="744" y="168" width="376" height="290" rx="14" fill="#eef3fa" stroke="#9fc0e0" stroke-width="2"/>
    <rect x="744" y="168" width="376" height="290" rx="14" fill="url(#plateGlow)"/>
    <g stroke="#2563b0" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M744 182 v-14 h14"/>
      <path d="M1106 168 h14 v14"/>
      <path d="M744 444 v14 h14"/>
      <path d="M1106 458 h14 v-14"/>
    </g>

    <g transform="translate(772,196)" fill="none" stroke="#47566b"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- board edge with two pads -->
      <rect x="16" y="48" width="18" height="112" rx="2" fill="#f5f8fc"/>
      <rect x="34" y="60" width="8" height="8" fill="#f5f8fc"/>
      <rect x="34" y="146" width="8" height="8" fill="#f5f8fc"/>
      <!-- wires -->
      <path d="M42 64 H84"/>
      <path d="M146 64 H196"/>
      <path d="M226 64 H270 V150 H42"/>
      <!-- resistor -->
      <polyline points="84,64 92,56 100,72 108,56 116,72 124,56 132,72 140,56 146,64"/>
      <!-- LED in drafting blue -->
      <g stroke="#2563b0" stroke-width="2.4">
        <path d="M198 52 L198 76 L226 64 Z"/>
        <path d="M226 52 V76"/>
        <path d="M208 50 L216 42"/>
        <path d="M216 42 L211 43 M216 42 L215 47"/>
        <path d="M214 55 L222 47"/>
        <path d="M222 47 L217 48 M222 47 L221 52"/>
      </g>
    </g>
    <!-- schematic labels -->
    <g font-size="12" fill="#7d8ba0" letter-spacing="0.5"
       font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
      <text x="824" y="248">D9~</text>
      <text x="887" y="240" text-anchor="middle">220 &#937;</text>
      <text x="984" y="286" text-anchor="middle">LED</text>
      <text x="824" y="360">GND</text>
    </g>

    <line x1="762" y1="420" x2="1102" y2="420" stroke="#c9d6e6" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="762" y="443" font-size="15" fill="#7d8ba0" letter-spacing="2"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">FIG. 01 — BLINK AN LED</text>
  </g>
</svg>
