<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#d2e6ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="cyanGlow" cx="80%" cy="2%" r="70%">
      <stop offset="0%" stop-color="#5bd0e6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5bd0e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="8%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- deep blueprint field -->
  <rect width="1200" height="630" fill="#07182a"/>
  <!-- the working sheet, a step lighter, lifted off the field -->
  <rect x="34" y="30" width="1132" height="570" rx="16" fill="#0d2745" stroke="#b8d4f4" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="34" y="30" width="1132" height="570" rx="16" fill="url(#grid)"/>
  <rect x="34" y="30" width="1132" height="570" rx="16" fill="url(#cyanGlow)"/>
  <rect x="34" y="30" width="1132" height="570" rx="16" fill="url(#amberGlow)"/>

  <!-- masthead: solder-pad mark + wordmark -->
  <g transform="translate(74,54) scale(0.56)">
    <rect width="100" height="100" rx="22" fill="#12314f"/>
    <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="#5bd0e6" stroke-opacity="0.5" stroke-width="2"/>
    <g stroke="#5bd0e6" stroke-width="4.4" stroke-linecap="round" fill="none">
      <path d="M23 29 L41 41"/>
      <path d="M59 59 L77 71"/>
    </g>
    <g fill="#5bd0e6">
      <circle cx="23" cy="29" r="4.2"/>
      <circle cx="77" cy="71" r="4.2"/>
    </g>
    <circle cx="50" cy="50" r="13" fill="none" stroke="#5bd0e6" stroke-width="4.6"/>
    <circle cx="50" cy="50" r="4.6" fill="#eef4fc"/>
  </g>
  <text x="146" y="84" font-size="33" font-weight="700" fill="#f1f6fd" letter-spacing="-0.5"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Sketchef</text>
  <text x="148" y="107" font-size="13.5" font-weight="700" fill="#f5a524" letter-spacing="3"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">ARDUINO PROJECT FINDER</text>
  <text x="1126" y="90" text-anchor="end" font-size="15" font-weight="600" fill="#9cb8dc" letter-spacing="2"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">DWG. 00 · COVER SHEET</text>
  <line x1="74" y1="134" x2="1126" y2="134" stroke="#b8d4f4" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- headline (mono display voice) -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700" letter-spacing="-2.5">
    <text x="74" y="250" font-size="56" fill="#f1f6fd">What can you build</text>
    <text x="74" y="322" font-size="56" fill="#f5a524">with your kit?</text>
  </g>

  <!-- subhead -->
  <text x="76" y="398" font-size="23" fill="#c2d6f0">Pick your Arduino board and the parts you own —</text>
  <text x="76" y="431" font-size="23" fill="#c2d6f0">the projects you can actually build, with wiring, steps, code.</text>

  <!-- primary action + catalog readout -->
  <g transform="translate(76,460)">
    <rect width="228" height="54" rx="9" fill="#f5a524"/>
    <text x="26" y="35" font-size="21" font-weight="700" fill="#241300"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Start building &#8594;</text>
  </g>
  <text x="78" y="560" font-size="16.5" font-weight="600" fill="#9cb8dc" letter-spacing="1.5"
        font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">5 BOARDS &#183; 14 COMPONENTS &#183; 20 PROJECTS</text>

  <!-- key drawing: FIG. 01 blink an LED, a recessed well with amber corner ticks -->
  <g>
    <rect x="740" y="158" width="386" height="322" rx="14" fill="#091d34" stroke="#f5a524" stroke-opacity="0.42" stroke-width="1.5"/>
    <g stroke="#f5a524" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M740 174 v-16 h16"/>
      <path d="M1110 158 h16 v16"/>
      <path d="M740 464 v16 h16"/>
      <path d="M1110 480 h16 v-16"/>
    </g>

    <g transform="translate(772,208)" fill="none" stroke="#c2d6f0"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- board edge with two pads -->
      <rect x="10" y="52" width="20" height="118" rx="2"/>
      <rect x="30" y="66" width="8" height="8"/>
      <rect x="30" y="152" width="8" height="8"/>
      <!-- wires in cyan -->
      <g stroke="#5bd0e6">
        <path d="M38 70 H86"/>
        <path d="M150 70 H206"/>
        <path d="M240 70 H286 V158 H38"/>
      </g>
      <!-- resistor -->
      <polyline points="86,70 94,60 102,80 110,60 118,80 126,60 134,80 142,60 150,70" stroke="#c2d6f0"/>
      <!-- LED in amber -->
      <g stroke="#f5a524" stroke-width="2.6">
        <path d="M208 56 L208 84 L240 70 Z"/>
        <path d="M240 56 V84"/>
        <path d="M220 54 L229 44"/>
        <path d="M229 44 L223 45 M229 44 L228 50"/>
        <path d="M227 60 L236 50"/>
        <path d="M236 50 L230 51 M236 50 L235 56"/>
      </g>
    </g>

    <g font-size="12.5" fill="#9cb8dc" letter-spacing="0.5"
       font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
      <text x="826" y="262">D9~</text>
      <text x="905" y="252" text-anchor="middle">220 &#937;</text>
      <text x="1010" y="300" text-anchor="middle">LED</text>
      <text x="820" y="382">GND</text>
    </g>

    <line x1="758" y1="440" x2="1108" y2="440" stroke="#5bd0e6" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="758" y="463" font-size="15" fill="#9cb8dc" letter-spacing="2"
          font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">FIG. 01 — BLINK AN LED</text>
  </g>
</svg>
